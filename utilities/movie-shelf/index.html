<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A visual shelf of physical film discs, with a random picker." />
    <link rel="canonical" href="https://fb-personal-utilities.web.app/utilities/movie-shelf/" />
    <meta property="og:title" content="Movie Shelf" />
    <meta property="og:description" content="A visual shelf of physical film discs, with a random picker." />
    <meta property="og:url" content="https://fb-personal-utilities.web.app/utilities/movie-shelf/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Movie Shelf" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Movie Shelf" />
    <meta name="twitter:description" content="A visual shelf of physical film discs, with a random picker." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Movie Shelf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=9" />
    <title>Movie Shelf</title>
  </head>
  <body>
    <canvas id="c" aria-label="Film poster sphere"></canvas>

    <header id="chrome">
      <label class="search-wrap">
        <span class="sr-only">Find a film</span>
        <input id="search" type="search" placeholder="Find a film…" autocomplete="off" spellcheck="false" />
      </label>
      <div id="home-chips" class="chips" role="group" aria-label="Home filter"></div>
      <div class="chrome-btns">
        <button id="stats-btn" type="button">Stats</button>
      </div>
    </header>

    <div id="title-bar"><h1>Film Collection</h1></div>
    <div id="loading">
      <div class="spinner"></div>
      <span id="loading-msg">Loading posters…</span>
    </div>

    <div id="browse" hidden>
      <div id="browse-meta"></div>
      <div id="browse-track"></div>
      <button id="browse-close" type="button">Back to sphere</button>
    </div>

    <div id="trivia"><div id="trivia-text"></div></div>

    <div id="actions">
      <button id="btn-browse" type="button">Browse</button>
      <button id="btn-pick" type="button">Pick a film</button>
      <button id="quiz-btn" type="button">Quiz</button>
    </div>

    <aside id="details">
      <img id="d-img" alt="" />
      <div class="d-copy">
        <div class="d-title" id="d-title"></div>
        <div class="d-year" id="d-year"></div>
        <div class="d-home" id="d-home"></div>
        <a class="lb" id="d-link" href="#" target="_blank" rel="noreferrer">View on Letterboxd</a>
        <button id="btn-again" type="button">Pick another</button>
      </div>
    </aside>

    <div id="quiz-overlay">
      <div id="quiz-panel" role="dialog" aria-labelledby="quiz-heading">
        <button id="quiz-close" type="button" aria-label="Close quiz">Close</button>
        <h2 id="quiz-heading">FB's Movie Quiz</h2>
        <div id="quiz-error" hidden>Quiz questions failed to load.</div>
        <div id="quiz-setup">
          <div class="quiz-setup-row">
            <span class="quiz-setup-lbl">Round</span>
            <div class="quiz-chips" id="quiz-len-chips">
              <button type="button" class="quiz-chip active" data-n="10">10</button>
              <button type="button" class="quiz-chip" data-n="20">20</button>
              <button type="button" class="quiz-chip" data-n="25">25</button>
            </div>
          </div>
          <div class="quiz-setup-row">
            <span class="quiz-setup-lbl">Difficulty</span>
            <div class="quiz-chips" id="quiz-diff-chips">
              <button type="button" class="quiz-chip active" data-d="all">All</button>
              <button type="button" class="quiz-chip" data-d="12">Easy 1–2</button>
              <button type="button" class="quiz-chip" data-d="34">3–4</button>
              <button type="button" class="quiz-chip" data-d="5">Hard 5</button>
            </div>
          </div>
          <button type="button" id="quiz-start">Start</button>
        </div>
        <div id="quiz-play" hidden>
          <div id="quiz-meta">
            <span id="quiz-progress"></span>
            <span id="quiz-cat"></span>
          </div>
          <div id="quiz-q"></div>
          <div id="quiz-opts"></div>
          <button type="button" id="quiz-next" disabled>Next</button>
        </div>
        <div id="quiz-end" hidden>
          <div class="stat-hero" id="quiz-score">—</div>
          <div class="stat-sub" id="quiz-score-sub"></div>
          <div class="quiz-end-actions">
            <button type="button" id="quiz-again">Play Again</button>
            <button type="button" id="quiz-end-close">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div id="stats-overlay">
      <div id="stats-panel" role="dialog" aria-labelledby="stats-heading">
        <button id="stats-close" type="button" aria-label="Close stats">Close</button>
        <h2 id="stats-heading">Collection</h2>
        <div class="stats-section">
          <div class="stat-hero" id="stat-total">—</div>
          <div class="stat-sub" id="stat-span"></div>
        </div>
        <div class="stats-section">
          <h3>By home</h3>
          <div id="home-chart"></div>
        </div>
        <div class="stats-section">
          <h3>By era</h3>
          <div id="decade-chart"></div>
        </div>
        <div class="stats-section">
          <h3>Top directors</h3>
          <div id="director-list"></div>
        </div>
      </div>
    </div>

    <script src="./movies.js?v=9"></script>
    <script src="./trivia.js?v=9"></script>
    <script src="./quiz.js?v=9" onerror="window.QUIZ_QUESTIONS=null"></script>
    <script src="./app.js?v=9"></script>
  </body>
</html>
