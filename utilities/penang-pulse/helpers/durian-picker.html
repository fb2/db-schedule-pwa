<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0f6e6e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Durian types · 榴莲品种</title>
  <style>
    :root {
      --bg: #f7f4ec;
      --surface: #fffdf7;
      --text: #14201c;
      --muted: #5a6560;
      --line: #d4d0c4;
      --accent: #0f6e6e;
      --accent-deep: #0a5555;
      --selected-bg: #0f6e6e;
      --selected-text: #fffdf7;
      --selected-muted: rgba(255, 253, 247, 0.78);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC",
        "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      text-size-adjust: 100%;
    }

    body {
      padding-bottom: calc(20px + var(--safe-bottom));
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: calc(10px + var(--safe-top)) 14px 12px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .hint {
      margin: 6px 0 0;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--accent-deep);
    }

    .hint-en {
      display: block;
      margin-top: 2px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .count {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
    }

    .clear {
      appearance: none;
      border: 2px solid var(--accent);
      background: var(--surface);
      color: var(--accent-deep);
      border-radius: 12px;
      min-height: 48px;
      padding: 0 16px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .clear:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .clear:not(:disabled):active {
      background: var(--accent);
      color: var(--selected-text);
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 8px 10px 0;
      display: grid;
      gap: 8px;
    }

    .section-label {
      margin: 14px 4px 2px;
      padding: 0 4px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .row {
      display: block;
      width: 100%;
      text-align: left;
      appearance: none;
      border: 2px solid var(--line);
      background: var(--surface);
      color: inherit;
      border-radius: 14px;
      min-height: 76px;
      padding: 14px 16px;
      font: inherit;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .row:active {
      transform: scale(0.99);
    }

    .row.is-selected {
      background: var(--selected-bg);
      border-color: var(--accent-deep);
      color: var(--selected-text);
      box-shadow: inset 0 0 0 2px rgba(255, 253, 247, 0.25);
    }

    .zh {
      display: block;
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem 0.7rem;
      margin-top: 6px;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .en {
      color: var(--text);
    }

    .code {
      color: var(--accent-deep);
      font-variant-numeric: tabular-nums;
    }

    .nick {
      display: block;
      margin-top: 4px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.3;
    }

    .row.is-selected .en,
    .row.is-selected .code {
      color: var(--selected-text);
    }

    .row.is-selected .nick {
      color: var(--selected-muted);
    }

    .foot {
      margin: 18px 16px 0;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header class="top">
    <h1 class="title">Durian types · 榴莲品种</h1>
    <p class="hint">
      请指品种
      <span class="hint-en">Point / tap the type</span>
    </p>
    <div class="toolbar">
      <span class="count" id="count" aria-live="polite">0 selected</span>
      <button type="button" class="clear" id="clear" disabled>Clear · 清除</button>
    </div>
  </header>

  <main>
    <p class="section-label">Classics · 经典</p>
    <ul class="list" id="classics"></ul>
    <p class="section-label">Also notable · 也值得找</p>
    <ul class="list" id="notable"></ul>
    <p class="foot">Unlisted helper — flash the Chinese name at the stall. Tap again to deselect.</p>
  </main>

  <script>
    const CLASSICS = [
      { zh: "猫山王", en: "Musang King", code: "D197", nick: "Raja Kunyit / 黄姜王" },
      { zh: "黑刺", en: "Black Thorn", code: "D200", nick: "Ochee" },
      { zh: "红虾", en: "Red Prawn", code: "D175", nick: "Udang Merah · ask Penang" },
      { zh: "苏丹王", en: "D24 / Sultan", code: "D24", nick: "" },
      { zh: "金凤", en: "Golden Phoenix", code: "D198", nick: "金凤凰" },
      { zh: "XO", en: "XO", code: "", nick: "often D24-adjacent" },
      { zh: "葫芦", en: "Hor Lor", code: "D163", nick: "" },
      { zh: "IOI", en: "IOI", code: "D168", nick: "Mas Muar / 金鳄鱼 · stalls say “D101”" },
      { zh: "金包", en: "D13 / Hock 13", code: "D226", nick: "福明 / Hock Beng" },
      { zh: "竹脚", en: "Tekka", code: "D160", nick: "Musang Queen / 猫山王后" },
      { zh: "604", en: "604", code: "D166", nick: "Penang number name" },
      { zh: "红肉", en: "Red Flesh (Penang)", code: "D164", nick: "" },
      { zh: "青皮15", en: "Qing Pi 15", code: "D165", nick: "" },
    ];

    const NOTABLE = [
      { zh: "甘榜", en: "Kampung / seedling", code: "", nick: "not one clone" },
      { zh: "劳勿猫山王", en: "Raub Musang King", code: "D197", nick: "same genetics, Raub origin" },
      { zh: "金枕", en: "Monthong", code: "", nick: "Thai classic" },
      { zh: "奶油包", en: "Creamy Bun", code: "D28", nick: "" },
      { zh: "鳄鱼", en: "Buaya / Crocodile", code: "D167", nick: "" },
      { zh: "松鼠王", en: "Tupai King", code: "D214?", nick: "confirm at stall" },
      { zh: "绿竹", en: "Green Bamboo", code: "?", nick: "verify label" },
      { zh: "黑珍珠", en: "Black Pearl", code: "?", nick: "verify not unmarked MSW" },
      { zh: "D88", en: "D88", code: "D88", nick: "sometimes 橙肉 talk" },
      { zh: "乌龙", en: "D13.5 / Wu Long", code: "", nick: "D13 offshoot — only if labelled" },
      { zh: "曼谷树16", en: "Real MARDI D101", code: "D101", nick: "≠ stall “IOI = D101”" },
      { zh: "D2", en: "D2", code: "D2", nick: "old-school clone" },
      { zh: "Puyat", en: "Puyat", code: "", nick: "Filipino classic" },
    ];

    const selected = new Set();
    const countEl = document.getElementById("count");
    const clearBtn = document.getElementById("clear");

    function updateChrome() {
      const n = selected.size;
      countEl.textContent = n === 0 ? "0 selected" : n === 1 ? "1 selected · 已选 1" : n + " selected · 已选 " + n;
      clearBtn.disabled = n === 0;
    }

    function makeRow(item, index, prefix) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "row";
      btn.dataset.id = prefix + "-" + index;

      const zh = document.createElement("span");
      zh.className = "zh";
      zh.textContent = item.zh;

      const meta = document.createElement("span");
      meta.className = "meta";

      const en = document.createElement("span");
      en.className = "en";
      en.textContent = item.en;
      meta.appendChild(en);

      if (item.code) {
        const code = document.createElement("span");
        code.className = "code";
        code.textContent = item.code;
        meta.appendChild(code);
      }

      btn.appendChild(zh);
      btn.appendChild(meta);

      if (item.nick) {
        const nick = document.createElement("span");
        nick.className = "nick";
        nick.textContent = item.nick;
        btn.appendChild(nick);
      }

      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        if (selected.has(id)) {
          selected.delete(id);
          btn.classList.remove("is-selected");
          btn.setAttribute("aria-pressed", "false");
        } else {
          selected.add(id);
          btn.classList.add("is-selected");
          btn.setAttribute("aria-pressed", "true");
        }
        updateChrome();
      });
      btn.setAttribute("aria-pressed", "false");

      li.appendChild(btn);
      return li;
    }

    function fill(listId, items, prefix) {
      const ul = document.getElementById(listId);
      const frag = document.createDocumentFragment();
      items.forEach((item, i) => frag.appendChild(makeRow(item, i, prefix)));
      ul.appendChild(frag);
    }

    fill("classics", CLASSICS, "c");
    fill("notable", NOTABLE, "n");

    clearBtn.addEventListener("click", () => {
      selected.clear();
      document.querySelectorAll(".row.is-selected").forEach((el) => {
        el.classList.remove("is-selected");
        el.setAttribute("aria-pressed", "false");
      });
      updateChrome();
    });

    updateChrome();
  </script>
</body>
</html>
